# Self-contained CI. This repo is public and nextjedi/platform is private, so the reusable
# workflow nextjedi/platform/.github/workflows/ci-web.yml@main cannot be called from here.
# Keep the steps in line with ci-web.yml (checkout, Node 22, npm ci, make verify).
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make verify
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-web
          path: |
            coverage/
          if-no-files-found: ignore
