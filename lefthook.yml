# Git hooks (https://lefthook.dev). Installed by `make setup` (scripts/install-hooks.mjs).
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,mjs,cjs,ts,json,css,html,md,yml,yaml}'
      run: npx --no-install prettier --check --ignore-unknown {staged_files}
    eslint:
      glob: '*.{js,mjs,cjs,ts,html}'
      run: npx --no-install eslint --no-warn-ignored {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: make verify
